<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单编辑</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-layout">
    <!-- 侧边栏 -->
    <div class="admin-sidebar">
        <div class="sidebar-logo">商城后台</div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/yonghu/list}">用户管理</a></li>
            <li><a th:href="@{/shangpin/list}">商品管理</a></li>
            <li class="active"><a th:href="@{/dingdan/list}">订单管理</a></li>
            <li><a th:href="@{/guanggao/list}">广告管理</a></li>
            <li><a th:href="@{/gouwuche/list}">购物车管理</a></li>
            <li><a th:href="@{/dingzhi/list}">定制管理</a></li>
            <li><a th:href="@{/xiaoxi/list}">私信管理</a></li>
            <li><a th:href="@{/}">返回前台</a></li>
        </ul>
    </div>
    <!-- 主区域 -->
    <div class="admin-main">
        <div class="admin-header">
            <span class="header-title" th:if="${order != null and order.id != null}">编辑订单</span>
            <span class="header-title" th:if="${order == null or order.id == null}">新增订单</span>
            <div class="header-user">
                <span class="user-name" th:text="${session.user != null ? session.user.nickname : '未登录'}">用户</span>
            </div>
        </div>
        <div class="admin-content">
            <div class="edit-container">
                <div th:if="${msg != null}" class="alert alert-danger">
                    <span th:text="${msg}">错误信息</span>
                </div>
                <h2>
                    <span th:if="${order != null and order.id != null}">编辑订单</span>
                    <span th:if="${order == null or order.id == null}">新增订单</span>
                </h2>
                <form th:action="@{/dingdan/save}" th:object="${order}" method="post" class="form-horizontal">
                    <input type="hidden" th:field="*{id}" th:if="*{id != null}"/>
                    <div class="form-group">
                        <label>订单编号</label>
                        <input type="text" class="form-control" th:field="*{orderNo}" placeholder="请输入订单编号" th:readonly="*{id != null}"/>
                    </div>
                    <div class="form-group">
                        <label>用户ID</label>
                        <input type="number" class="form-control" th:field="*{userId}" placeholder="请输入用户ID"/>
                    </div>
                    <div class="form-group">
                        <label>总金额</label>
                        <input type="text" class="form-control" th:field="*{totalAmount}" placeholder="请输入总金额"/>
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select class="form-control" th:field="*{status}">
                            <option value="待付款">待付款</option>
                            <option value="已付款">已付款</option>
                            <option value="已发货">已发货</option>
                            <option value="已完成">已完成</option>
                            <option value="已取消">已取消</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>收货人</label>
                        <input type="text" class="form-control" th:field="*{receiverName}" placeholder="请输入收货人姓名"/>
                    </div>
                    <div class="form-group">
                        <label>电话</label>
                        <input type="text" class="form-control" th:field="*{receiverPhone}" placeholder="请输入收货人电话"/>
                    </div>
                    <div class="form-group">
                        <label>收货地址</label>
                        <input type="text" class="form-control" th:field="*{receiverAddress}" placeholder="请输入收货地址"/>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a th:href="@{/dingdan/list}" class="btn btn-default">返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
