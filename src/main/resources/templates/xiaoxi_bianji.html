<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>私信编辑</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-layout">
    <!-- 侧边栏 -->
    <div class="admin-sidebar">
        <div class="sidebar-logo">商城后台</div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/yonghu/list}">用户管理</a></li>
            <li><a th:href="@{/shangpin/list}">商品管理</a></li>
            <li><a th:href="@{/dingdan/list}">订单管理</a></li>
            <li><a th:href="@{/guanggao/list}">广告管理</a></li>
            <li><a th:href="@{/gouwuche/list}">购物车管理</a></li>
            <li><a th:href="@{/dingzhi/list}">定制管理</a></li>
            <li class="active"><a th:href="@{/xiaoxi/list}">私信管理</a></li>
            <li><a th:href="@{/}">返回前台</a></li>
        </ul>
    </div>
    <!-- 主区域 -->
    <div class="admin-main">
        <div class="admin-header">
            <span class="header-title" th:if="${message != null and message.id != null}">编辑私信</span>
            <span class="header-title" th:if="${message == null or message.id == null}">新增私信</span>
            <div class="header-user">
                <span class="user-name" th:text="${session.user != null ? session.user.nickname : '未登录'}">用户</span>
            </div>
        </div>
        <div class="admin-content">
            <div class="edit-container">
                <div th:if="${msg != null}" class="alert alert-danger">
                    <span th:text="${msg}">错误信息</span>
                </div>
                <h2>
                    <span th:if="${message != null and message.id != null}">编辑私信</span>
                    <span th:if="${message == null or message.id == null}">新增私信</span>
                </h2>
                <form th:action="@{/xiaoxi/save}" th:object="${message}" method="post" class="form-horizontal">
                    <input type="hidden" th:field="*{id}" th:if="*{id != null}"/>
                    <div class="form-group">
                        <label>发送人ID</label>
                        <input type="number" class="form-control" th:field="*{senderId}" placeholder="请输入发送人ID"/>
                    </div>
                    <div class="form-group">
                        <label>接收人ID</label>
                        <input type="number" class="form-control" th:field="*{receiverId}" placeholder="请输入接收人ID"/>
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <textarea class="form-control" th:field="*{content}" rows="3" placeholder="请输入私信内容"></textarea>
                    </div>
                    <div class="form-group">
                        <label>是否已读</label>
                        <select class="form-control" th:field="*{isRead}">
                            <option value="0">未读</option>
                            <option value="1">已读</option>
                        </select>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a th:href="@{/xiaoxi/list}" class="btn btn-default">返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
