<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册 - 野生菌商城</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- 注册容器 -->
    <div class="auth-container">
        <div class="auth-box">
            <h2>用户注册</h2>
            <!-- 错误提示，msg不为空时显示 -->
            <div th:if="${msg != null}" class="alert alert-danger">
                <span th:text="${msg}">错误信息</span>
            </div>
            <!-- 注册表单，提交到 /zhuce -->
            <form th:action="@{/zhuce}" method="post">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label for="nickname">昵称</label>
                    <input type="text" class="form-control" id="nickname" name="nickname" placeholder="请输入昵称">
                </div>
                <div class="form-group">
                    <label for="phone">手机号</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="请输入手机号">
                </div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>
            <!-- 底部链接，跳转到登录页 -->
            <div class="auth-link">
                已有账号？<a th:href="@{/denglu}">去登录</a>
            </div>
        </div>
    </div>
</body>
</html>
