<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>山野珍菌商城 - 首页</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* ========== 广告轮播区域 - 从右到左自动滚动 ========== */
        .ad-carousel-area {
            width: 100%;
            background: linear-gradient(90deg, #1B5E20 0%, #2E7D32 100%);
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .ad-carousel-track {
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 12px 0;
            white-space: nowrap;
            /* 两段相同内容拼接，形成无缝滚动 */
            animation: adScrollLeft 30s linear infinite;
            width: max-content;
        }

        .ad-carousel-area:hover .ad-carousel-track {
            animation-play-state: paused;
        }

        /* 从右到左滚动：从 0 平移到 -50%（刚好滚完第一段） */
        @keyframes adScrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ad-carousel-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            background: rgba(255,255,255,0.14);
            border-radius: 24px;
            font-size: 15px;
            color: #fff;
            transition: background 0.3s, transform 0.3s;
        }

        .ad-carousel-item:hover {
            background: #F57C00;
            transform: scale(1.04);
        }

        .ad-carousel-item .ad-icon {
            font-size: 16px;
        }

        .ad-carousel-item a {
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* ========== 首页热门推荐商品卡片调整 ========== */
        .front-content .product-grid .product-card {
            width: 260px;
        }

        .front-content .product-grid .product-card .card-img {
            height: 220px;
            overflow: hidden;
        }

        /* 图片完整显示 - 等比缩放覆盖 */
        .front-content .product-grid .product-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .front-content .product-grid .product-card .card-img span {
            line-height: 220px;
        }

        /* 商品描述样式 */
        .front-content .product-grid .product-card .card-desc {
            font-size: 13px;
            color: #888;
            line-height: 1.4;
            margin-bottom: 8px;
            /* 限制显示约20个字 */
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 - 深绿背景 -->
    <div class="front-nav">
        <div class="nav-inner">
            <a class="logo" th:href="@{/}">山野珍菌商城</a>
            <ul class="menu">
                <li class="active"><a th:href="@{/}">首页</a></li>
                <li><a th:href="@{/fenlei}">商品分类</a></li>
                <li><a th:href="@{/gouwuche/view}">购物车</a></li>
                <li><a th:href="@{/wodeDingdan}">我的订单</a></li>
            </ul>
            <!-- 搜索框 + 搜索按钮 -->
            <div class="search-wrap">
                <input type="text" class="search-box" id="searchInput" placeholder="搜索商品" oninput="doSearch()">
                <button class="search-btn" onclick="doSearch()">搜索</button>
            </div>
            <div class="user-area">
                <span th:if="${session.user != null}" th:text="${session.user.nickname != null ? session.user.nickname : session.user.username}">用户名</span>
                <a th:if="${session.user != null and session.user.role == 'admin'}" th:href="@{/houtai}" class="btn-text">后台管理</a>
                <a th:if="${session.user != null}" th:href="@{/tuichu}" class="btn-text">退出</a>
                <a th:if="${session.user == null}" th:href="@{/denglu}" class="btn-text">登录</a>
                <a th:if="${session.user == null}" th:href="@{/zhuce}" class="btn-text">注册</a>
            </div>
        </div>
    </div>

    <!-- Hero Banner -->
    <div class="hero-banner">
        <h1>新鲜野生菌精选商城</h1>
        <p>山野直采 安心品质</p>
        <a th:href="@{/fenlei}" class="btn-shop">立即选购</a>
    </div>

    <!-- 广告轮播区域 - 从数据库读取，自动从右到左滚动 -->
    <div class="ad-carousel-area" th:if="${ads != null and !ads.isEmpty()}">
        <div class="ad-carousel-track">
            <!-- 第一段：实际广告数据 -->
            <span class="ad-carousel-item" th:each="ad : ${ads}">
                <a th:href="${ad.linkUrl != null and ad.linkUrl != '' ? ad.linkUrl : '#'}">
                    <span class="ad-icon">📢</span>
                    <span th:text="${ad.title}">广告标题</span>
                </a>
            </span>
            <!-- 第二段：复制同样数据，形成无缝循环 -->
            <span class="ad-carousel-item" th:each="ad : ${ads}">
                <a th:href="${ad.linkUrl != null and ad.linkUrl != '' ? ad.linkUrl : '#'}">
                    <span class="ad-icon">📢</span>
                    <span th:text="${ad.title}">广告标题</span>
                </a>
            </span>
        </div>
    </div>

    <!-- 热门推荐 -->
    <div class="front-content">
        <h2 class="section-title">热门推荐</h2>
        <div class="product-grid" id="productGrid">
            <div class="product-card" th:each="p : ${products}" th:attr="data-name=${p.name}">
                <div class="card-img">
                    <span th:if="${p.imageUrl == null or p.imageUrl == ''}">🍄</span>
                    <img th:if="${p.imageUrl != null and p.imageUrl != ''}" th:src="${p.imageUrl}" alt="">
                </div>
                <div class="card-body">
                    <div class="card-name" th:text="${p.name}">商品名称</div>
                    <div class="card-desc" th:if="${p.description != null and p.description != ''}"
                         th:text="${p.description.length() > 20 ? p.description.substring(0, 20) + '...' : p.description}">商品描述</div>
                    <div class="card-price" th:text="'¥' + ${#numbers.formatDecimal(p.price, 1, 2)}">¥0.00</div>
                    <div class="card-stock">
                        <span th:if="${p.stock != null and p.stock > 0}">库存：<span th:text="${p.stock}">0</span>件</span>
                        <span th:if="${p.stock == null or p.stock <= 0}" class="stock-out">暂时缺货</span>
                    </div>
                    <div class="card-btns">
                        <a class="btn btn-default btn-sm" th:href="@{/shangpin/xiangqing/{id}(id=${p.id})}">详情</a>
                        <a class="btn btn-warning btn-sm" th:href="@{/gouwuche/jiaru(productId=${p.id})}">加入购物车</a>
                    </div>
                </div>
            </div>
        </div>
        <!-- 无商品提示 -->
        <div th:if="${#lists.isEmpty(products)}" style="text-align:center;padding:60px;color:#999;">
            <p style="font-size:48px;margin-bottom:16px;">🍄</p>
            <p>暂无上架商品，请先在后台添加商品</p>
        </div>
        <!-- 无搜索结果提示 -->
        <div id="noResult" style="display:none;text-align:center;padding:60px;color:#999;">
            <p style="font-size:48px;margin-bottom:16px;">🔍</p>
            <p>没有找到相关商品</p>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="front-footer">
        <p>山野珍菌商城 &nbsp;|&nbsp; 品质保障 · 新鲜直达 &nbsp;|&nbsp; 客服热线：400-888-8888</p>
        <p style="margin-top:6px;opacity:0.6;">云南野生菌专营 · 山珍美味 健康生活</p>
    </div>

    <script>
        // 搜索功能 - 实时过滤商品
        function doSearch() {
            var kw = document.getElementById('searchInput').value.trim();
            var cards = document.querySelectorAll('#productGrid .product-card');
            var hasResult = false;

            for (var i = 0; i < cards.length; i++) {
                var name = cards[i].getAttribute('data-name');
                if (kw == '' || name.indexOf(kw) != -1) {
                    cards[i].style.display = 'block';
                    hasResult = true;
                } else {
                    cards[i].style.display = 'none';
                }
            }

            document.getElementById('noResult').style.display = hasResult ? 'none' : 'block';
        }
    </script>
</body>
</html>
