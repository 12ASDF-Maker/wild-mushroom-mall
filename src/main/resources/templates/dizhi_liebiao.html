<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>收货地址管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <div class="admin-sidebar">
            <div class="sidebar-logo">商城后台</div>
            <ul class="sidebar-menu">
                <li><a th:href="@{/houtai}">后台首页</a></li>
                <li><a th:href="@{/yonghu/list}">用户管理</a></li>
                <li><a th:href="@{/shangpin/list}">商品管理</a></li>
                <li><a th:href="@{/dingdan/list}">订单管理</a></li>
                <li><a th:href="@{/guanggao/list}">广告管理</a></li>
                <li><a th:href="@{/gouwuche/list}">购物车管理</a></li>
                <li><a th:href="@{/dingzhi/list}">定制管理</a></li>
                <li><a th:href="@{/xiaoxi/list}">私信管理</a></li>
                <li><a th:href="@{/}">返回前台</a></li>
            </ul>
        </div>
        <!-- 主区域 -->
        <div class="admin-main">
            <!-- 顶部Header -->
            <div class="admin-header">
                <span class="header-title">收货地址管理</span>
                <input type="text" class="header-search" placeholder="搜索">
                <div class="header-user">
                    <span class="bell">🔔</span>
                    <span class="user-name" th:text="${session.user != null ? session.user.nickname : '未登录'}">用户</span>
                </div>
            </div>
            <!-- 内容区 -->
            <div class="admin-content">
                <!-- 表格容器 -->
                <div class="table-container">
                    <div class="table-header">
                        <h3>我的收货地址</h3>
                        <a th:href="@{/dizhi/add}" class="btn btn-primary btn-sm">新增</a>
                    </div>
                    <div class="table-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>收货人</th>
                                    <th>联系电话</th>
                                    <th>收货地址</th>
                                    <th>默认地址</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="addr : ${list}">
                                    <td th:text="${addr.id}">1</td>
                                    <td th:text="${addr.receiverName}">收货人</td>
                                    <td th:text="${addr.receiverPhone}">联系电话</td>
                                    <td th:text="${addr.receiverAddress}">收货地址</td>
                                    <td>
                                        <span th:if="${addr.isDefault == 1}" class="tag tag-green">默认</span>
                                        <span th:if="${addr.isDefault == null or addr.isDefault == 0}" class="tag tag-gray">非默认</span>
                                    </td>
                                    <td th:text="${addr.createTime}">创建时间</td>
                                    <td>
                                        <a th:href="@{/dizhi/delete/{id}(id=${addr.id})}" class="btn btn-danger btn-sm" onclick="return confirm('确定删除吗？')">删除</a>
                                    </td>
                                </tr>
                                <tr th:if="${list == null or list.isEmpty()}">
                                    <td colspan="7" style="text-align:center;">暂无收货地址，请点击新增添加</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
