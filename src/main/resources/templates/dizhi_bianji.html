<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>地址编辑</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-layout">
    <!-- 侧边栏 -->
    <div class="admin-sidebar">
        <div class="sidebar-logo">商城后台</div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/houtai}">后台首页</a></li>
            <li><a th:href="@{/yonghu/list}">用户管理</a></li>
            <li><a th:href="@{/shangpin/list}">商品管理</a></li>
            <li><a th:href="@{/dingdan/list}">订单管理</a></li>
            <li><a th:href="@{/guanggao/list}">广告管理</a></li>
            <li><a th:href="@{/gouwuche/list}">购物车管理</a></li>
            <li><a th:href="@{/dingzhi/list}">定制管理</a></li>
            <li><a th:href="@{/xiaoxi/list}">私信管理</a></li>
            <li><a th:href="@{/}">返回前台</a></li>
        </ul>
    </div>
    <!-- 主区域 -->
    <div class="admin-main">
        <div class="admin-header">
            <span class="header-title" th:if="${dizhi != null and dizhi.id != null}">编辑收货地址</span>
            <span class="header-title" th:if="${dizhi == null or dizhi.id == null}">新增收货地址</span>
            <div class="header-user">
                <span class="user-name" th:text="${session.user != null ? session.user.nickname : '未登录'}">用户</span>
            </div>
        </div>
        <div class="admin-content">
            <div class="edit-container">
                <div th:if="${msg != null}" class="alert alert-danger">
                    <span th:text="${msg}">错误信息</span>
                </div>
                <h2>
                    <span th:if="${dizhi != null and dizhi.id != null}">编辑收货地址</span>
                    <span th:if="${dizhi == null or dizhi.id == null}">新增收货地址</span>
                </h2>
                <form th:action="@{/dizhi/save}" th:object="${dizhi}" method="post" class="form-horizontal">
                    <input type="hidden" th:field="*{id}" th:if="*{id != null}"/>
                    <div class="form-group">
                        <label>收货人姓名</label>
                        <input type="text" class="form-control" th:field="*{receiverName}" placeholder="请输入收货人姓名"/>
                    </div>
                    <div class="form-group">
                        <label>收货人电话</label>
                        <input type="text" class="form-control" th:field="*{receiverPhone}" placeholder="请输入收货人电话"/>
                    </div>
                    <div class="form-group">
                        <label>收货详细地址</label>
                        <textarea class="form-control" th:field="*{receiverAddress}" rows="3" placeholder="请输入收货详细地址"></textarea>
                    </div>
                    <div class="form-group">
                        <label>是否默认地址</label>
                        <select class="form-control" th:field="*{isDefault}">
                            <option value="1">默认地址</option>
                            <option value="0">非默认地址</option>
                        </select>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a th:href="@{/dizhi/list}" class="btn btn-default">返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
