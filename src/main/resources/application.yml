# 服务器端口
server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  # 数据库连接配置
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # SQL初始化配置
  # 请先在HeidiSQL中手动导入根目录的schema.sql建库建表，再启动项目
  sql:
    init:
      mode: never
  # Thymeleaf配置
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
  # HTTP编码配置，确保中文参数正确解码
  http:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shop.entity
  configuration:
    map-underscore-to-camel-case: true
